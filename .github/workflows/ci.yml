name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.command }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command:
          - lint
          - format
          - typecheck
          - test
          - build
          - build-assets:check
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable pnpm

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm ${{ matrix.command }}

  deploy:
    name: Deploy to Fly.io
    needs:
      - checks
    runs-on: ubuntu-latest
    environment: Prod
    concurrency: fly-deploy
    steps:
      - uses: actions/checkout@v4
        with:
          # sitemap.xml's lastmod dates come from `git log` at build time;
          # a shallow clone would only have the latest commit's history.
          fetch-depth: 0

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
