name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.command }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command:
          - lint
          - format
          - typecheck
          - test
          - build
          - build-assets:pgexamples:check
          - build-assets:search-index:check
          - build-assets:sitemap:check
        # sitemap.xml's lastmod dates come from `git log` at build time; a
        # shallow clone only has the latest commit's history, so every file's
        # "last modified" commit would collapse to that one commit. Only `build`
        # and build-assets:sitemap:check actually touch that, so only they pay
        # for a full clone — same principle as only build-assets:pgexamples:check
        # ever needing a live `pnpm run dev:pg`. A boolean flag, not a numeric
        # fetch-depth override: `${{ matrix.fetch-depth || 1 }}` would silently
        # clobber a real `fetch-depth: 0` back to 1, since GitHub Actions'  `||`
        # treats 0 as falsy, same as JavaScript.
        include:
          - command: build
            full-checkout: true
          - command: build-assets:sitemap:check
            full-checkout: true
    steps:
      - uses: actions/checkout@v4
        if: matrix.full-checkout
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        if: ${{ !matrix.full-checkout }}

      - run: corepack enable pnpm

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm ${{ matrix.command }}

  deploy:
    name: Deploy to Fly.io
    needs:
      - checks
    runs-on: ubuntu-latest
    environment: Prod
    concurrency: fly-deploy
    steps:
      - uses: actions/checkout@v4
        with:
          # sitemap.xml's lastmod dates come from `git log` at build time;
          # a shallow clone would only have the latest commit's history.
          fetch-depth: 0

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
